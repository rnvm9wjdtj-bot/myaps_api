version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: myaps_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - myaps_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: myaps_api:latest
    container_name: myaps_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /opt/myaps_api:/app
    environment:
      - TZ=Asia/Shanghai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROJECT_JSON=dev
      - MYAPS_DB_HOST=62.234.20.251
      - MYAPS_DB_PORT=3333
      - MYAPS_DB_USER=root
      - MYAPS_DB_PASSWORD=E9damw0o@#$
      - MYAPS_DB_SET=aps1,aps2
      - MYAPS_MAIN_DB=aps1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - myaps_network
    working_dir: /app
    command: bash -c "cd /app && gunicorn -c scripts/deploy/gunicorn.conf.py myaps.main:app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  myaps_network:
    driver: bridge

volumes:
  redis_data:
    driver: local