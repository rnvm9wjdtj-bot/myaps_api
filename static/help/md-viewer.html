<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档查看器 - 帮助中心</title>
    <link rel="icon" type="image/png" href="/static/swagger/favicon.png">
    <link href="/static/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/mds/css/bootstrap-icons.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .navbar-brand {
            font-weight: 600;
        }
        .markdown-body {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 2.5rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .markdown-body h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #2d3748;
            border-bottom: 2px solid #667eea;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .markdown-body h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #4a5568;
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #edf2f7;
        }
        .markdown-body h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #4a5568;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body h4 {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body p {
            color: #4a5568;
            line-height: 1.75;
            margin-bottom: 0.8rem;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.88rem;
        }
        .markdown-body table th {
            background: #667eea;
            color: #fff;
            font-weight: 600;
            padding: 0.6rem 0.75rem;
            border: 1px solid #5a6fd6;
            text-align: left;
            white-space: nowrap;
        }
        .markdown-body table td {
            padding: 0.6rem 0.75rem;
            border: 1px solid #e2e8f0;
            color: #4a5568;
            vertical-align: top;
        }
        .markdown-body table tr:nth-child(even) {
            background: #f7fafc;
        }
        .markdown-body table tr:hover {
            background: #edf2f7;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 1.5rem;
            margin-bottom: 0.8rem;
        }
        .markdown-body li {
            color: #4a5568;
            line-height: 1.75;
            margin-bottom: 0.3rem;
        }
        .markdown-body code {
            background: #edf2f7;
            color: #e53e3e;
            padding: 0.15rem 0.35rem;
            border-radius: 3px;
            font-family: "Courier New", monospace;
            font-size: 0.88em;
        }
        .markdown-body pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .markdown-body pre code {
            background: none;
            color: inherit;
            padding: 0;
            font-size: 0.88em;
        }
        .markdown-body blockquote {
            border-left: 4px solid #667eea;
            padding: 0.5rem 1rem;
            margin: 1rem 0;
            color: #718096;
            background: #f7fafc;
            border-radius: 0 4px 4px 0;
        }
        .markdown-body blockquote p {
            margin-bottom: 0;
        }
        .markdown-body strong {
            color: #2d3748;
            font-weight: 600;
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 1.5rem 0;
        }
        .markdown-body a {
            color: #667eea;
            text-decoration: none;
        }
        .markdown-body a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4" style="background: #667eea;">
        <div class="container">
            <a class="navbar-brand" href="/help" target="_blank">
                <i class="bi bi-question-circle"></i> 帮助中心
            </a>
            <span class="navbar-text text-white" id="doc-title">
                <i class="bi bi-file-earmark-text"></i> 文档查看器
            </span>
        </div>
    </nav>

    <div class="container-fluid py-3">
        <div class="markdown-body" id="content">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3 text-muted">正在加载文档...</p>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4">
        <small class="text-muted">MyAPS 帮助中心</small>
    </footer>

    <script src="/static/lib/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            var mdPath = params.get('md');
            var title = params.get('title') || '文档查看器';

            document.getElementById('doc-title').innerHTML =
                '<i class="bi bi-file-earmark-text"></i> ' + title;
            document.title = title + ' - 帮助中心';

            if (!mdPath) {
                document.getElementById('content').innerHTML =
                    '<div class="alert alert-warning">未指定文档路径</div>';
                return;
            }

            fetch(mdPath)
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('文档加载失败: ' + response.status);
                    }
                    return response.text();
                })
                .then(function(markdown) {
                    var html = marked.parse(markdown);
                    document.getElementById('content').innerHTML = html;
                })
                .catch(function(error) {
                    document.getElementById('content').innerHTML =
                        '<div class="alert alert-danger">' +
                        '<i class="bi bi-exclamation-triangle"></i> ' +
                        '文档加载失败，请刷新页面重试<br><small>' + error.message + '</small>' +
                        '</div>';
                    console.error('加载文档失败:', error);
                });
        });
    </script>
</body>
</html>
