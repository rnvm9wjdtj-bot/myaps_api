<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据清洗管理系统</title>
    <link rel="icon" type="image/png" href="/static/swagger/favicon.png">
    <link href="/static/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/mds/css/bootstrap-icons.css">
    <script src="/static/lib/bootstrap/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
        }
        .card-nav {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
        }
        .card-nav:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .card-nav-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: white;
            margin-bottom: 1rem;
        }
        .card-nav-body {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card-nav-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }
        .card-nav-desc {
            font-size: 0.875rem;
            color: #718096;
            line-height: 1.4;
            margin-bottom: 1rem;
            flex: 1;
        }
        .card-nav-stats {
            font-size: 0.875rem;
            color: #667eea;
            font-weight: 500;
        }
        .card-nav-link {
            text-decoration: none;
            display: block;
            height: 100%;
        }
        .card-nav-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 12px;
            height: 12px;
            background: #dc3545;
            border-radius: 50%;
            display: none;
        }
        .card-nav-badge.show {
            display: block;
            animation: badge-pulse 1.5s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.5;
                transform: scale(1.2);
            }
        }
        .stats-loading {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .header-link {
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .header-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center text-white mb-5">
            <h1 class="mb-2" data-i18n="mds.app.title">数据清洗管理系统</h1>
            <!-- <p class="mb-2 opacity-75">主数据管理与数据质量控制平台</p> -->
            <div class="mt-2 d-flex justify-content-center align-items-center">
                <a href="/mds/user-guide" class="header-link me-3" target="_blank">
                    <i class="bi bi-book"></i> <span data-i18n="mds.app.guide">操作指引</span>
                </a>
                <a href="/docs" class="header-link me-3">
                    <i class="bi bi-code-slash"></i> <span data-i18n="mds.app.apiDoc">API文档</span>
                </a>
                <select id="lang-selector" class="form-select form-select-sm" style="width: auto; background-color: rgba(255,255,255,0.9); border: none;">
                    <option value="zh-CN">🇨🇳 中文</option>
                    <option value="en-US">🇺🇸 English</option>
                    <option value="de-DE">🇩🇪 Deutsch</option>
                </select>
            </div>
        </div>
        
        <div class="text-center mb-4">
            <button class="btn btn-light btn-lg shadow-sm me-3" id="globalValidateBtn">
                <i class="bi bi-shield-check"></i> <span data-i18n="mds.action.validate">校验</span>
            </button>
            <button class="btn btn-light btn-lg shadow-sm" id="globalSyncBtn">
                <i class="bi bi-cloud-upload"></i> <span data-i18n="mds.action.sync">推送</span>
            </button>
        </div>
        
        <div class="row g-4" id="cardsContainer">
{cards}
        </div>
        
    </div>
    
    <div id="migrateTriggerZone" style="position: fixed; right: 0; bottom: 0; width: 120px; height: 120px; z-index: 1000; cursor: default;">
        <button class="btn btn-sm" id="migrateBtn" title="数据库结构迁移" disabled 
                style="opacity: 0; pointer-events: none; background: rgba(108, 117, 234, 0.9); color: white; border: none; border-radius: 8px 0 0 0;">
            <i class="bi bi-database-gear"></i>
        </button>
    </div>

    <script>
        var MODULES_CONFIG = {modules_config};

        async function loadStats() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(function() { controller.abort(); }, 5000);
                
                const response = await fetch('/api/mds/index-stats', {
                    signal: controller.signal,
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
                
                const result = await response.json();
                
                if (result.success === 1) {
                    updateAllCards(result.data);
                } else {
                    throw new Error(result.message || '查询失败');
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.error('请求超时');
                } else {
                    console.error('加载统计数据失败:', error);
                }
                showDefaultStats();
            }
        }

        function updateAllCards(statsData) {
            if (!Array.isArray(statsData)) {
                console.error('统计数据格式错误: 期望数组');
                return;
            }
            
            statsData.forEach(function(item) {
                if (!item.table || typeof item.pending !== 'number') {
                    console.warn('跳过无效统计项:', item);
                    return;
                }
                
                const statsEl = document.querySelector('[data-table="' + item.table + '"]');
                const badgeEl = document.querySelector('[data-badge-table="' + item.table + '"]');
                
                if (statsEl) {
                    const pending = formatNumber(item.pending || 0);
                    const error = (item.compliance_error || 0) + (item.relation_error || 0);
                    statsEl.innerHTML = '待处理: ' + pending + '条' + (error > 0 ? ' | 异常: ' + error + '条' : '');
                    
                    if (badgeEl) {
                        if (item.pending > 0 || error > 0) {
                            badgeEl.classList.add('show');
                        } else {
                            badgeEl.classList.remove('show');
                        }
                    }
                }
            });
        }

        function formatNumber(num) {
            if (num > 9999) return '9,999+';
            return num.toLocaleString('zh-CN');
        }

        function showDefaultStats() {
            document.querySelectorAll('.card-nav-stats').forEach(function(el) {
                el.innerHTML = '<span class="text-muted">--</span>';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
        });
    </script>

    <div class="modal fade" id="globalOpsDialog" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="globalOpsDialogTitle" data-i18n="mds.modal.confirm">操作确认</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info mb-3">
                        <i class="bi bi-info-circle"></i> <span id="globalOpsDesc">操作将按依赖顺序处理以下模块</span>
                    </div>
                    <div class="mb-3" id="dependencyFlow"></div>
                    <table class="table table-sm table-hover mb-3">
                        <thead>
                            <tr>
                                <th style="width:40px">#</th>
                                <th data-i18n="mds.nav.material">模块</th>
                                <th style="width:100px" data-i18n="mds.stats.pending">待处理</th>
                            </tr>
                        </thead>
                        <tbody id="moduleListBody"></tbody>
                    </table>
                    <div class="alert alert-warning mb-0">
                        <i class="bi bi-exclamation-triangle"></i> <span data-i18n="mds.stats.total">预估处理</span>: <strong id="totalPending">0</strong> <span data-i18n="mds.table.total">条数据</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="mds.modal.cancel">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmGlobalOps" data-i18n="mds.modal.confirm">确认执行</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="globalOpsProgress" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-hourglass-split" id="progressIcon"></i>
                        <span id="progressTitle" data-i18n="mds.other.processing">执行中...</span>
                    </h5>
                </div>
                <div class="modal-body">
                    <div class="progress mb-3" style="height: 25px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" id="overallProgress" style="width: 0%">0%</div>
                    </div>
                    <div class="row g-2 mb-3" id="moduleStatusCards"></div>
                    <div class="bg-dark text-light p-2 rounded mb-3" style="max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;">
                        <div id="execLog"></div>
                    </div>
                    <div id="summaryReport" style="display: none;">
                        <div class="alert alert-success mb-3">
                            <i class="bi bi-check-circle"></i> <span data-i18n="mds.success.syncComplete">执行完成</span>
                        </div>
                        <div class="row text-center mb-3">
                            <div class="col">
                                <h4 class="text-success" id="totalSuccess">0</h4>
                                <small class="text-muted" data-i18n="mds.stats.passed">成功</small>
                            </div>
                            <div class="col">
                                <h4 class="text-danger" id="totalFailed">0</h4>
                                <small class="text-muted" data-i18n="mds.stats.failed">失败</small>
                            </div>
                            <div class="col">
                                <h4 class="text-primary" id="totalTime">0s</h4>
                                <small class="text-muted">耗时</small>
                            </div>
                        </div>
                        <table class="table table-sm">
                            <thead><tr><th data-i18n="mds.nav.material">模块</th><th data-i18n="mds.stats.passed">成功</th><th data-i18n="mds.stats.failed">失败</th><th data-i18n="mds.table.status">状态</th></tr></thead>
                            <tbody id="detailResultBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="cancelExecutionBtn" data-i18n="mds.action.cancel">取消执行</button>
                    <button type="button" class="btn btn-primary d-none" id="viewDetailBtn" data-i18n="mds.action.view">查看详情</button>
                    <button type="button" class="btn btn-secondary d-none" id="closeProgressBtn" data-bs-dismiss="modal" data-i18n="mds.modal.close">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="migrateDialog" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-database-gear"></i> 数据库结构迁移</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="migrateDiffBody"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="closeMigrateDialogBtn">取消</button>
                    <button type="button" class="btn btn-warning" id="confirmMigrateBtn">确认迁移</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="migrateProgress" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-arrow-repeat"></i> 迁移执行中</h5>
                </div>
                <div class="modal-body">
                    <div class="progress mb-3" style="height: 20px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" id="migrateProgressBar" style="width: 0%">0%</div>
                    </div>
                    <p class="text-center text-muted" id="migrateProgressText">正在检测差异...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="migrateResult" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-check-circle"></i> 迁移结果</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="migrateResultBody"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="closeMigrateResultBtn">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- i18n国际化支持 -->
    <script src="/static/lib/i18n/i18n.js"></script>
    <script src="/static/lib/i18n/zh-CN.js"></script>
    <script src="/static/lib/i18n/en-US.js"></script>
    <script src="/static/lib/i18n/de-DE.js"></script>
    <script src="/static/mds/js/global-ops-controller.js"></script>
    <script src="/static/mds/js/migrate-controller.js"></script>
    <script>
        // 初始化i18n并设置语言
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化i18n实例
            if (typeof i18n !== 'undefined') {
                const savedLang = localStorage.getItem('i18n_lang') || 'zh-CN';
                i18n.init(savedLang);
            }
            
            // 初始化迁移控制器
            if (typeof MigrateController !== 'undefined') {
                MigrateController.init();
            }
            
            // 语言切换处理
            const langSelector = document.getElementById('lang-selector');
            if (langSelector) {
                const savedLang = localStorage.getItem('i18n_lang') || 'zh-CN';
                langSelector.value = savedLang;
                
                langSelector.addEventListener('change', function() {
                    const lang = this.value;
                    if (typeof switchLanguage === 'function') {
                        switchLanguage(lang);
                    } else if (typeof i18n !== 'undefined') {
                        // 降级处理：如果switchLanguage未定义，直接调用i18n
                        i18n.switchLanguage(lang);
                        localStorage.setItem('i18n_lang', lang);
                        location.reload();
                    }
                });
            }
        });
    </script>
</body>
</html>
