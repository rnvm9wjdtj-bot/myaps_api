<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据清洗管理系统</title>
    <link href="/static/mds/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/mds/css/bootstrap-icons.css">
    <script src="/static/mds/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px 16px 0 0 !important;
            padding: 2rem;
        }
        .table-link {
            display: block;
            padding: 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }
        .table-link:hover {
            background-color: #f8f9fa;
            transform: translateX(5px);
            text-decoration: none;
        }
        .table-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        .table-info {
            flex: 1;
        }
        .table-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }
        .table-desc {
            color: #666;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header text-center text-white">
                <h1 class="mb-2">数据清洗管理系统</h1>
                <p class="mb-0 opacity-75">主数据管理与数据质量控制平台</p>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush">
{nav_items}
                </div>
            </div>
            <div class="card-footer text-center py-3 bg-light">
                <small class="text-muted">数据清洗管理系统 v1.0 | <a href="/docs" class="text-decoration-none">API文档</a></small>
            </div>
        </div>
    </div>
</body>
</html>
