<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作指引 - 数据清洗管理系统</title>
    <link rel="icon" type="image/png" href="/static/swagger/favicon.png">
    <link href="/static/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/mds/css/bootstrap-icons.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .navbar-brand {
            font-weight: 600;
        }
        .markdown-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .markdown-body h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #2d3748;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4a5568;
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #edf2f7;
        }
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #4a5568;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body p {
            color: #4a5568;
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }
        .markdown-body table th {
            background: #f7fafc;
            color: #2d3748;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            text-align: left;
        }
        .markdown-body table td {
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            color: #4a5568;
        }
        .markdown-body table tr:hover {
            background: #f7fafc;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body li {
            color: #4a5568;
            line-height: 1.7;
            margin-bottom: 0.5rem;
        }
        .markdown-body code {
            background: #edf2f7;
            color: #e53e3e;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: "Courier New", monospace;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .markdown-body pre code {
            background: none;
            color: inherit;
            padding: 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #667eea;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #718096;
        }
        .markdown-body strong {
            color: #2d3748;
            font-weight: 600;
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 2rem 0;
        }
        .toc {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        .toc-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }
        .toc-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        .toc-list li {
            margin-bottom: 0.25rem;
        }
        .toc-list a {
            color: #667eea;
            text-decoration: none;
        }
        .toc-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/mds" target="_blank">
                <i class="bi bi-clipboard-data"></i> 数据清洗管理系统
            </a>
            <span class="navbar-text text-white">
                <i class="bi bi-book"></i> 操作指引
            </span>
        </div>
    </nav>

    <div class="container-fluid py-3">
        <div class="markdown-body" id="content">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3 text-muted">正在加载文档...</p>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4">
        <small class="text-muted">数据清洗管理系统 v1.0</small>
    </footer>

    <script src="/static/lib/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/static/mds/docs/user-guide.md')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('文档加载失败');
                    }
                    return response.text();
                })
                .then(function(markdown) {
                    var html = marked.parse(markdown);
                    document.getElementById('content').innerHTML = html;
                })
                .catch(function(error) {
                    document.getElementById('content').innerHTML = 
                        '<div class="alert alert-danger">' +
                        '<i class="bi bi-exclamation-triangle"></i> ' +
                        '文档加载失败，请刷新页面重试' +
                        '</div>';
                    console.error('加载文档失败:', error);
                });
        });
    </script>
</body>
</html>
