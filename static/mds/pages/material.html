<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物料数据清洗管理</title>
    <link href="/static/mds/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/mds/css/custom.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="/mds">📊 数据清洗管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/mds/material">📦 物料</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mds/workcenter">🏭 工作中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mds/mat-ver">📋 产线版本</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mds/mat-wc">🛠️ 工艺路线</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mds/mat-wc-bom">📐 BOM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mds/mold">🔧 模具</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mds/mat-wc-mold">🔩 机台模具</a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm" style="width:100px" id="validateAllBtn">校验全部</button>
                    <button class="btn btn-outline-light btn-sm" style="width:100px" id="syncAllBtn">同步全部</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-2">
        <!-- 状态统计卡片 -->
        <div class="row mb-2">
            <div class="col-12" id="statusCardContainer"></div>
        </div>

        <!-- 操作按钮 + 筛选区域 -->
        <div class="filter-bar mb-2">
            <div class="row g-2 align-items-center">
                <div class="col-auto">
                    <button class="btn btn-primary btn-sm" style="width:100px" data-bs-toggle="modal" data-bs-target="#uploadModal">导入</button>
                    <button class="btn btn-success btn-sm" style="width:100px" id="validateBtn">校验</button>
                    <button class="btn btn-info btn-sm" style="width:100px" id="syncBtn">同步</button>
                    <button class="btn btn-outline-warning btn-sm" style="width:100px" id="rulesBtn">校验规则</button>
                </div>
                <div class="col-auto">
                    <select class="form-select form-select-sm" id="statusFilter" style="width:100px">
                        <option value="">全部状态</option>
                        <option value="pending">待处理</option>
                        <option value="validated">校验通过</option>
                        <option value="rejected">校验失败</option>
                        <option value="synced">已同步</option>
                    </select>
                </div>
                <div class="col-auto">
                    <select class="form-select form-select-sm" id="sourceFilter" style="width:100px">
                        <option value="">全部来源</option>
                        <option value="ERP">ERP</option>
                        <option value="MES">MES</option>
                        <option value="PLM">PLM</option>
                        <option value="excel">Excel</option>
                    </select>
                </div>
                <div class="col-auto flex-grow-1">
                    <input type="text" class="form-control form-control-sm" id="keywordInput" placeholder="搜索物料号或描述...">
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary btn-sm" id="searchBtn">查询</button>
                    <button class="btn btn-outline-secondary btn-sm" id="resetBtn">重置</button>
                    <button class="btn btn-outline-info btn-sm" data-bs-toggle="modal" data-bs-target="#advancedFilterModal">精准筛选</button>
                </div>
            </div>
        </div>

        <!-- 数据列表区域 -->
        <div class="data-table-container" id="tableContainer"></div>
    </div>

    <!-- 上传弹窗 -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">导入Excel数据</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">去重策略</label>
                        <select class="form-select" id="dedupStrategy">
                            <option value="skip">跳过重复（推荐）</option>
                            <option value="overwrite">覆盖重复</option>
                            <option value="reject">拒绝重复</option>
                        </select>
                    </div>
                    <div class="file-upload-area" id="uploadArea">
                        <p class="mb-0">点击或拖拽文件上传（支持 .xlsx, .xls, .csv）</p>
                        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display: none;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="uploadBtn">上传</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 精准筛选弹窗 -->
    <div class="modal fade" id="advancedFilterModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">精准筛选</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="filterConditions">
                        <div class="filter-condition-row mb-2">
                            <div class="row g-2 align-items-center">
                                <div class="col-auto">
                                    <span class="text-muted small">当</span>
                                </div>
                                <div class="col-3">
                                    <select class="form-select form-select-sm filter-field">
                                        <option value="">选择字段</option>
                                    </select>
                                </div>
                                <div class="col-2">
                                    <select class="form-select form-select-sm filter-operator">
                                        <option value="eq">等于</option>
                                        <option value="ne">不等于</option>
                                        <option value="like">包含</option>
                                        <option value="not_like">不包含</option>
                                        <option value="starts">开头是</option>
                                        <option value="ends">结尾是</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <input type="text" class="form-control form-control-sm filter-value" placeholder="请输入">
                                </div>
                                <div class="col-auto">
                                    <button type="button" class="btn btn-outline-danger btn-sm remove-condition-btn">×</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="addFilterCondition">
                        <span>+ 添加筛选条件</span>
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="clearAllFilters">清空</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary btn-sm" id="applyAdvancedFilter">应用筛选</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 批量编辑弹窗 -->
    <div class="modal fade" id="batchEditModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">批量编辑记录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <button class="btn btn-outline-primary btn-sm" id="showFieldSelectBtn">+ 选择字段</button>
                        <div id="fieldSelectPanel" class="mt-2 p-2 border rounded" style="display:none; max-height:300px; overflow-y:auto;">
                            <input type="text" class="form-control form-control-sm mb-2" id="fieldSearchInput" placeholder="搜索字段...">
                            <div id="fieldCheckboxList"></div>
                        </div>
                    </div>
                    <div id="batchEditFields"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="applyBatchEdit">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑记录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm"></form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/mds/js/bootstrap.bundle.min.js"></script>
    <script src="/static/mds/js/common.js"></script>
    <script src="/static/mds/js/modal-manager.js"></script>
    <script src="/static/mds/js/api-client.js"></script>
    <script src="/static/mds/js/data-table.js"></script>
    <script src="/static/mds/js/status-card.js"></script>
    <script src="/static/mds/js/material.js"></script>
</body>
</html>
