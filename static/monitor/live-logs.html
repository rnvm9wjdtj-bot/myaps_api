<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时日志 - 系统监控</title>
    <link rel="icon" href="/static/swagger/favicon.png" type="image/png">
    <link rel="stylesheet" href="/static/monitor/css/monitor.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
        }
        .live-logs-container {
            max-width: 100%;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .live-logs-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .live-logs-header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .live-logs-header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
        }
        .status-dot.connected {
            background: #2ecc71;
        }
        .status-dot.connecting {
            background: #f39c12;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-control-group label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .header-control-group select, 
        .header-control-group input {
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        .header-control-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .header-control-group select option {
            background: #667eea;
            color: white;
        }
        .header-control-group input[type="checkbox"] {
            width: 14px;
            height: 14px;
        }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .btn-danger {
            background: rgba(220, 53, 69, 0.8);
            color: white;
        }
        .btn-danger:hover {
            background: rgba(220, 53, 69, 1);
        }
        .logs-container {
            height: calc(100vh - 180px);
            min-height: 400px;
            overflow-y: auto;
            padding: 15px 30px;
            background: #1e1e1e;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 15px;
            line-height: 1.7;
        }
        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            gap: 15px;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-time {
            color: #888;
            white-space: nowrap;
            width: 85px;
            flex-shrink: 0;
        }
        .log-level {
            font-weight: 600;
            width: 70px;
            text-align: center;
            flex-shrink: 0;
        }
        .log-level.DEBUG { color: #9e9e9e; }
        .log-level.INFO { color: #4fc3f7; }
        .log-level.WARNING { color: #ffb74d; }
        .log-level.ERROR { color: #ef5350; }
        .log-level.CRITICAL { color: #e57373; background: #3e2723; padding: 0 6px; border-radius: 3px; }
        .log-module {
            color: #9e9e9e;
            width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .log-message {
            color: #e0e0e0;
            flex: 1;
            word-break: break-all;
        }
        .log-entry.DEBUG .log-message {
            color: #a0a0a0;
        }
        .log-entry.INFO .log-message {
            color: #4fc3f7;
        }
        .log-entry.WARNING .log-message {
            color: #ffb74d;
        }
        .log-entry.ERROR .log-message {
            color: #ef5350;
        }
        .log-entry.CRITICAL .log-message {
            color: #e57373;
            font-weight: 500;
        }
        .no-logs {
            text-align: center;
            color: #666;
            padding: 60px 20px;
        }
        .log-stats {
            display: flex;
            gap: 20px;
            padding: 10px 30px;
            background: #2d2d2d;
            color: #888;
            font-size: 12px;
        }
        .log-stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .level-count {
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 500;
        }
        .level-count.DEBUG { background: #424242; color: #888; }
        .level-count.INFO { background: #1565c0; color: #4fc3f7; }
        .level-count.WARNING { background: #e65100; color: #ffb74d; }
        .level-count.ERROR { background: #b71c1c; color: #ef5350; }
        .level-count.CRITICAL { background: #3e2723; color: #e57373; }
        .auto-scroll-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
        }
        .auto-scroll-indicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="live-logs-container">
        <div class="live-logs-header">
            <div class="live-logs-header-left">
                <h3>实时日志流</h3>
                <div class="connection-status">
                    <div class="status-dot connecting" id="statusDot"></div>
                    <span id="statusText">连接中...</span>
                </div>
            </div>
            
            <div class="header-controls">
                <div class="header-control-group">
                    <label>级别:</label>
                    <select id="levelFilter" onchange="applyFilters()">
                        <option value="">全部</option>
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                </div>
                
                <div class="header-control-group">
                    <input type="text" id="searchInput" placeholder="搜索日志..." onkeyup="handleSearch(event)">
                </div>
                
                <div class="header-control-group">
                    <label>
                        <input type="checkbox" id="autoScroll" checked onchange="toggleAutoScroll()">
                        自动滚动
                    </label>
                </div>
                
                <button class="btn btn-secondary" onclick="togglePause()">
                    <span id="pauseBtnText">暂停</span>
                </button>
                
                <button class="btn btn-danger" onclick="clearLogs()">清空</button>
                
                <button class="btn btn-primary" onclick="openInNewWindow()">新窗口</button>
            </div>
        </div>
        
        <div class="log-stats">
            <span>总日志: <strong id="totalCount">0</strong></span>
            <span>DEBUG: <span class="level-count DEBUG" id="debugCount">0</span></span>
            <span>INFO: <span class="level-count INFO" id="infoCount">0</span></span>
            <span>WARNING: <span class="level-count WARNING" id="warningCount">0</span></span>
            <span>ERROR: <span class="level-count ERROR" id="errorCount">0</span></span>
            <span>CRITICAL: <span class="level-count CRITICAL" id="criticalCount">0</span></span>
        </div>
        
        <div class="logs-container" id="logsContainer">
            <div class="no-logs" id="noLogs">
                正在等待日志数据...
            </div>
        </div>
    </div>
    
    <div class="auto-scroll-indicator" id="autoScrollIndicator">
        ⬇️ 已暂停自动滚动 - 点击滚动到底部
    </div>

    <script>
        let eventSource = null;
        let logs = [];
        const MAX_LOGS = 2000;  // 前端日志数量上限
        let isPaused = false;
        let autoScroll = true;
        let searchTerm = '';
        let levelFilter = '';
        let stats = { DEBUG: 0, INFO: 0, WARNING: 0, ERROR: 0, CRITICAL: 0 };
        let lastActivity = Date.now();
        const INACTIVITY_TIMEOUT = 30 * 60 * 1000;
        let isDomReady = false;
        let isRendering = false;  // 防止渲染冲突
        let pendingRerender = false;  // 标记是否有待处理的重渲染
        
        function checkDomReady() {
            const container = document.getElementById('logsContainer');
            const noLogs = document.getElementById('noLogs');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (container && noLogs && statusDot && statusText) {
                isDomReady = true;
                console.log('DOM元素已就绪');
                return true;
            }
            return false;
        }
        
        function connect() {
            if (eventSource) {
                eventSource.close();
            }
            
            if (isDomReady) {
                updateStatus('connecting');
            }
            
            const sseUrl = `/monitor/api/live-logs/stream?_=${Date.now()}`;
            console.log('正在连接 SSE:', sseUrl);
            
            eventSource = new EventSource(sseUrl);
            
            eventSource.onopen = () => {
                updateStatus('connected');
                lastActivity = Date.now();
            };
            
            eventSource.onmessage = (event) => {
                if (isPaused) return;
                
                try {
                    if (!event.data) {
                        console.warn('收到空数据');
                        return;
                    }
                    const logData = JSON.parse(event.data);
                    if (!logData || !logData.level || !logData.message) {
                        console.warn('无效的日志数据:', logData);
                        return;
                    }
                    addLog(logData);
                    lastActivity = Date.now();
                } catch (e) {
                    console.error('解析日志数据失败:', e);
                }
            };
            
            eventSource.onerror = (error) => {
                console.error('SSE 连接错误:', error);
                if (isDomReady) {
                    updateStatus('disconnected');
                }
                setTimeout(connect, 5000);
            };
        }
        
        function updateStatus(status) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (!dot || !text) {
                return;
            }
            
            dot.className = 'status-dot';
            
            switch (status) {
                case 'connected':
                    dot.classList.add('connected');
                    text.textContent = '已连接';
                    break;
                case 'connecting':
                    dot.classList.add('connecting');
                    text.textContent = '连接中...';
                    break;
                case 'disconnected':
                    text.textContent = '已断开 (5秒后重连)';
                    break;
            }
        }
        
        function addLog(logData) {
            logs.push(logData);
            
            // 限制前端日志数量，防止内存泄漏
            if (logs.length > MAX_LOGS) {
                const removeCount = logs.length - MAX_LOGS;
                // 同步更新统计
                for (let i = 0; i < removeCount; i++) {
                    const removedLog = logs[i];
                    if (stats[removedLog.level] > 0) {
                        stats[removedLog.level]--;
                    }
                }
                logs.splice(0, removeCount);
            }
            
            stats[logData.level] = (stats[logData.level] || 0) + 1;
            
            if (isDomReady) {
                updateStats();
                scheduleRender();  // 使用调度渲染代替直接渲染
            }
        }
        
        function scheduleRender() {
            // 如果正在渲染，标记待处理
            if (isRendering) {
                pendingRerender = true;
                return;
            }
            
            requestAnimationFrame(() => {
                isRendering = true;
                renderLogs();
                isRendering = false;
                
                // 如果有新的待处理渲染请求
                if (pendingRerender) {
                    pendingRerender = false;
                    scheduleRender();
                }
            });
        }
        
        function updateStats() {
            const totalCount = document.getElementById('totalCount');
            const debugCount = document.getElementById('debugCount');
            const infoCount = document.getElementById('infoCount');
            const warningCount = document.getElementById('warningCount');
            const errorCount = document.getElementById('errorCount');
            const criticalCount = document.getElementById('criticalCount');
            
            if (!totalCount || !debugCount || !infoCount || !warningCount || !errorCount || !criticalCount) {
                return;
            }
            
            totalCount.textContent = logs.length;
            debugCount.textContent = stats.DEBUG || 0;
            infoCount.textContent = stats.INFO || 0;
            warningCount.textContent = stats.WARNING || 0;
            errorCount.textContent = stats.ERROR || 0;
            criticalCount.textContent = stats.CRITICAL || 0;
        }
        
        function renderLogs() {
            const container = document.getElementById('logsContainer');
            if (!container) {
                console.error('日志容器元素 logsContainer 未找到');
                return;
            }
            
            if (logs.length === 0) {
                container.innerHTML = '<div class="no-logs" id="noLogs">正在等待日志数据...</div>';
                return;
            }
            
            const levelPriority = { DEBUG: 10, INFO: 20, WARNING: 30, ERROR: 40, CRITICAL: 50 };
            
            const filteredLogs = logs.filter(log => {
                if (levelFilter && levelPriority[log.level] < levelPriority[levelFilter]) return false;
                if (searchTerm && !log.message.toLowerCase().includes(searchTerm.toLowerCase())) return false;
                return true;
            });
            
            if (filteredLogs.length === 0) {
                container.innerHTML = '<div class="no-logs" id="noLogs">没有匹配的日志</div>';
                return;
            }
            
            // 使用 DocumentFragment 提高 DOM 操作效率
            const fragment = document.createDocumentFragment();
            
            for (const log of filteredLogs) {
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry ${log.level}`;
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'log-time';
                timeSpan.textContent = new Date(log.timestamp * 1000).toLocaleTimeString('zh-CN');
                
                const levelSpan = document.createElement('span');
                levelSpan.className = `log-level ${log.level}`;
                levelSpan.textContent = log.level;
                
                const moduleSpan = document.createElement('span');
                moduleSpan.className = 'log-module';
                moduleSpan.textContent = log.module;
                moduleSpan.title = log.module;
                
                const messageSpan = document.createElement('span');
                messageSpan.className = 'log-message';
                messageSpan.textContent = log.message;
                
                logEntry.appendChild(timeSpan);
                logEntry.appendChild(levelSpan);
                logEntry.appendChild(moduleSpan);
                logEntry.appendChild(messageSpan);
                
                fragment.appendChild(logEntry);
            }
            
            container.innerHTML = '';
            container.appendChild(fragment);
            
            if (autoScroll && !isPaused) {
                container.scrollTop = container.scrollHeight;
            }
        }
        
        function applyFilters() {
            const levelFilterEl = document.getElementById('levelFilter');
            const searchInputEl = document.getElementById('searchInput');
            
            if (levelFilterEl) {
                levelFilter = levelFilterEl.value;
            }
            if (searchInputEl) {
                searchTerm = searchInputEl.value;
            }
            scheduleRender();
        }
        
        function handleSearch(event) {
            if (event.key === 'Enter') {
                applyFilters();
            }
        }
        
        function togglePause() {
            isPaused = !isPaused;
            const pauseBtnText = document.getElementById('pauseBtnText');
            const autoScrollIndicator = document.getElementById('autoScrollIndicator');
            
            if (pauseBtnText) {
                pauseBtnText.textContent = isPaused ? '继续' : '暂停';
            }
            if (autoScrollIndicator) {
                autoScrollIndicator.classList.toggle('show', isPaused);
            }
        }
        
        function toggleAutoScroll() {
            const autoScrollEl = document.getElementById('autoScroll');
            if (autoScrollEl) {
                autoScroll = autoScrollEl.checked;
            }
            if (autoScroll && !isPaused) {
                const container = document.getElementById('logsContainer');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }
        }
        
        function clearLogs() {
            logs = [];
            stats = { DEBUG: 0, INFO: 0, WARNING: 0, ERROR: 0, CRITICAL: 0 };
            updateStats();
            const logsContainer = document.getElementById('logsContainer');
            if (logsContainer) {
                logsContainer.innerHTML = '<div class="no-logs">日志已清空</div>';
            }
        }
        
        function openInNewWindow() {
            window.open('/monitor/live-logs', '_blank');
        }
        
        const logsContainer = document.getElementById('logsContainer');
        const autoScrollIndicator = document.getElementById('autoScrollIndicator');
        
        if (logsContainer) {
            logsContainer.addEventListener('click', () => {
                if (isPaused) {
                    togglePause();
                }
            });
        }
        
        if (autoScrollIndicator) {
            autoScrollIndicator.addEventListener('click', () => {
                if (isPaused) {
                    togglePause();
                }
                const autoScrollEl = document.getElementById('autoScroll');
                if (autoScrollEl) {
                    autoScrollEl.checked = true;
                }
                autoScroll = true;
                const container = document.getElementById('logsContainer');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            });
        }
        
        setInterval(() => {
            if (Date.now() - lastActivity > INACTIVITY_TIMEOUT && !isPaused) {
                togglePause();
            }
        }, 60000);
        
        async function checkServiceStatus() {
            try {
                const response = await fetch('/monitor/api/live-logs/status');
                const status = await response.json();
                console.log('日志流服务状态:', status);
                return status.is_running;
            } catch (error) {
                console.error('检查服务状态失败:', error);
                return false;
            }
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(() => {
                if (checkDomReady()) {
                    updateStats();
                    renderLogs();
                }
                connect();
            }, 100);
            
            const isRunning = await checkServiceStatus();
            console.log('日志流服务是否运行:', isRunning);
        });
    </script>
</body>
</html>
