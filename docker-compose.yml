# MyAPS API Docker Compose 配置
#
# 使用方法：
#   生产部署（从Gitea Registry拉取）：
#     DOCKER_IMAGE=gitea.chaoge.xyz/chaoge/myaps-api:master docker-compose up -d
#   
#   本地构建部署：
#     docker-compose up -d --build
#
# 配置文件挂载：
#   自动根据 .env 中的 PROJECT_DIR 挂载整个目录
#   - ./project_files/${PROJECT_DIR}:/app/project_files/${PROJECT_DIR}
#
#   包含文件：
#     - {PROJECT_JSON}.json (租户配置)
#     - remind.py (告警配置)
#     - client.py 等Git托管文件（覆盖无影响）
#
# 网络模式：
#   全部使用host模式，统一通过localhost访问各服务

services:
  redis:
    image: redis:7-alpine
    container_name: myaps_redis
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: myaps_postgres
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - POSTGRES_USER=${THIS_DB_USER}
      - POSTGRES_PASSWORD=${THIS_DB_PASSWORD}
      - POSTGRES_DB=${THIS_DB_NAME}
      - POSTGRES_PORT=${THIS_DB_PORT:-5432}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${THIS_DB_USER} -d ${THIS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKER_IMAGE:-gitea.chaoge.xyz/chaoge/myaps-api:latest}
    container_name: myaps_api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      # 覆盖.env中的配置，适配host网络模式
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - THIS_DB_HOST=${THIS_DB_HOST:-localhost}
      - GUNICORN_BIND=0.0.0.0:${PORT:-8000}
      - APP_ROOT=/app
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      # 日志持久化
      - ./logs:/app/logs
      # 存储持久化（SQLite、Binlog位置等）
      - ./storage:/app/storage
      # 额外挂载存储目录到 apps 路径（适配代码中的相对路径引用）
      - ./storage:/app/apps/storage
      - ./storage:/app/apps/data_opt/storage
      # 项目配置目录挂载（自动使用.env中的PROJECT_DIR）
      # 挂载整个目录，自动包含：
      #   - {PROJECT_JSON}.json (租户配置)
      #   - remind.py (告警配置)
      #   - client.py 等托管文件会被覆盖，但内容相同无影响
      - ./project_files/${PROJECT_DIR}:/app/project_files/${PROJECT_DIR}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/docs"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # ============ 附加服务（默认开启）============
  # 监控和管理工具，随基础服务一起启动
  
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: myaps_uptime_kuma
    restart: unless-stopped
    network_mode: host
    environment:
      - UPTIME_KUMA_LISTEN=0.0.0.0:${UPTIME_KUMA_PORT:-3001}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./volumes/uptime-kuma:/app/data
    healthcheck:
      test: ["CMD", "node", "server/server.js", "--healthcheck"]
      interval: 60s
      timeout: 20s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
